<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    :root {
      --paper: #fff8d9;
      --paper-deep: #ffe58a;
      --gold: #d69b00;
      --gold-dark: #9f6f00;
      --red: #c80000;
      --red-dark: #8e0000;
      --blue: #0648b8;
      --ink: #2a1600;
      --muted: #725016;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "DFKai-sb", "BiauKai", "標楷體", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 10%, #fff4a8 0%, #ffd747 38%, #d99a00 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 舞台負責置中；真正縮放的是 report-container */
    #stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #report-container {
      width: 1160px;
      transform-origin: center center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,244,191,.92)),
        var(--paper);
      border: 8px double var(--red-dark);
      border-radius: 28px;
      padding: 34px 46px 30px;
      box-shadow:
        0 24px 70px rgba(80, 45, 0, .34),
        inset 0 0 0 4px rgba(214, 155, 0, .28);
      position: relative;
    }

    #report-container::before,
    #report-container::after {
      content: "";
      position: absolute;
      left: 34px;
      right: 34px;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--red), var(--gold), transparent);
      opacity: .72;
    }

    #report-container::before { top: 18px; }
    #report-container::after { bottom: 18px; }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      display: inline-flex;
      gap: 84px;
      align-items: center;
      justify-content: center;
      color: var(--red);
      font-size: 68px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(255,255,255,.72);
      padding: 2px 28px 10px;
      border-bottom: 3px solid rgba(200, 0, 0, .32);
    }

    .subtitle {
      margin-top: 14px;
      font-size: 32px;
      line-height: 1.35;
      letter-spacing: .04em;
    }

    .red-text {
      color: var(--red);
      font-weight: 900;
    }

    .blue-text {
      color: var(--blue);
      font-weight: 900;
    }

    .date-card {
      margin: 14px auto 20px;
      padding: 14px 22px;
      width: 88%;
      text-align: center;
      font-size: 28px;
      line-height: 1.55;
      background: rgba(255, 255, 255, .58);
      border: 2px solid rgba(214, 155, 0, .55);
      border-radius: 18px;
      box-shadow: inset 0 0 18px rgba(214, 155, 0, .12);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 10px 0 10px;
      color: var(--red-dark);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      height: 2px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(159,111,0,.72), transparent);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 150px 1fr;
      row-gap: 9px;
      column-gap: 16px;
      margin-bottom: 16px;
      padding: 18px 22px;
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(214,155,0,.42);
      border-radius: 18px;
      font-size: 27px;
      line-height: 1.36;
    }

    .label {
      color: var(--muted);
      font-weight: 900;
      white-space: nowrap;
      text-align: justify;
      text-align-last: justify;
    }

    .value {
      min-width: 0;
    }

    .preline {
      white-space: pre-line;
    }

    .stats-wrap {
      margin-top: 4px;
      border: 1px solid rgba(214,155,0,.5);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,.55);
    }

    .stats-row {
      display: grid;
      grid-template-columns: 168px 1fr 1fr 1fr;
      min-height: 54px;
      border-bottom: 1px solid rgba(214,155,0,.34);
      font-size: 28px;
      line-height: 1.25;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-name {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(255,229,138,.84), rgba(255,210,80,.72));
      color: var(--red-dark);
      font-weight: 900;
      border-right: 1px solid rgba(214,155,0,.46);
      white-space: nowrap;
    }

    .stat-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-right: 1px solid rgba(214,155,0,.22);
      white-space: nowrap;
    }

    .stat-cell:last-child {
      border-right: none;
    }

    .role {
      color: var(--muted);
      font-size: 24px;
      font-weight: 900;
    }

    .num {
      color: var(--blue);
      font-size: 34px;
      font-weight: 900;
      min-width: 42px;
      text-align: center;
    }

    .unit {
      color: var(--ink);
      font-size: 24px;
      font-weight: 900;
    }

    .total-row .stats-name,
    .grand-row .stats-name {
      background: linear-gradient(180deg, rgba(255,207,99,.96), rgba(238,171,0,.86));
    }

    .grand-row .stat-cell {
      grid-column: span 3;
      font-size: 31px;
    }

    .footer-section {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      margin-top: 18px;
      font-size: 26px;
      line-height: 1.45;
    }

    .note-box,
    .sign-box {
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(214,155,0,.42);
      border-radius: 18px;
      padding: 15px 18px;
    }

    .note-title {
      color: var(--red-dark);
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .note-grid {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 8px 10px;
      align-items: start;
    }

    .note-label {
      color: var(--muted);
      font-weight: 900;
      white-space: nowrap;
    }

    .note-content {
      color: var(--blue);
      font-weight: 900;
      white-space: pre-line;
      word-break: break-word;
    }

    .sign-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .sign-title {
      color: var(--muted);
      font-weight: 900;
    }

    .sign-name {
      color: var(--blue);
      font-size: 34px;
      font-weight: 900;
      line-height: 1.25;
      white-space: pre-line;
    }

    .kowtow {
      color: var(--red-dark);
      font-weight: 900;
      font-size: 28px;
    }

    .course-box {
      grid-column: 1 / -1;
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(214,155,0,.42);
      border-radius: 18px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 128px 1fr;
      gap: 12px;
      align-items: start;
    }

    .course-label {
      color: var(--red-dark);
      font-weight: 900;
      white-space: nowrap;
    }

    .course-content {
      color: var(--blue);
      font-weight: 900;
      white-space: pre-line;
      word-break: break-word;
    }

    @media (max-width: 720px) {
      #report-container {
        width: 980px;
        padding: 28px 34px 26px;
      }

      .title {
        font-size: 62px;
        gap: 68px;
      }

      .footer-section {
        grid-template-columns: 1fr 300px;
      }
    }
  </style>
</head>

    function getVal(data) {
      if (!data) return "";
      var rows = [];
      for (var i = 0; i < data.length; i++) {
        var rowText = "";
        for (var j = 0; j < data[i].length; j++) {
          if (data[i][j] !== "" && data[i][j] !== null && data[i][j] !== undefined) {
            rowText += data[i][j];
          }
        }
        if (rowText !== "") rows.push(rowText);
      }
      return rows.join("\n");
    }

  <script>
    function autoScale() {
      var container = document.getElementById('report-container');
      if (!container) return;

      container.style.transform = 'scale(1)';

      var margin = Math.max(18, Math.min(window.innerWidth, window.innerHeight) * 0.035);
      var winW = window.innerWidth - margin * 2;
      var winH = window.innerHeight - margin * 2;
      var contentW = container.scrollWidth;
      var contentH = container.scrollHeight;

      if (contentW === 0 || contentH === 0) return;

      var scaleX = winW / contentW;
      var scaleY = winH / contentH;
      var finalScale = Math.min(scaleX, scaleY, 1.22);
      finalScale = Math.max(finalScale, 0.35);

      container.style.transform = 'scale(' + finalScale + ')';
    }

    window.addEventListener('load', function () {
      requestAnimationFrame(autoScale);
      setTimeout(autoScale, 250);
    });
    window.addEventListener('resize', autoScale);
    window.addEventListener('orientationchange', function () {
      setTimeout(autoScale, 350);
    });
  </script>
