  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;

    .blue-text { color: blue; font-weight: 700; }

      margin: 0 0 18px 0;
    }

    .main-row {

      gap: 44px;
      height: 438px;
      overflow: hidden;
    }

    .section-title {
      color: red;
      font-size: 31px;
      font-weight: 700;
      border-bottom: 2px solid red;
      padding-bottom: 5px;
      margin-bottom: 16px;
      line-height: 1;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 31px;
      line-height: 1.48;
    }

    .info-table td {
      vertical-align: top;
      padding: 2px 0;
    }

    .info-label {

      white-space: nowrap;
      color: #111;
    }

    .info-value {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .leader-line {

    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 31px;
      line-height: 1.35;
    }

    .stats-table td {

      white-space: nowrap;
    }

    .stats-label { width: 174px; }

    .stats-total td {
      border-bottom: 3px solid red;
      padding-top: 19px;
      font-size: 35px;
    }

    .bottom-row {
      height: 254px;
      margin-top: 21px;
      display: grid;
      grid-template-columns: 1fr 405px;
      gap: 34px;
      overflow: hidden;
    }

    .notes-box {
      min-width: 0;
      overflow: hidden;
    }

    .notes-title {
      color: red;
      font-size: 30px;
      font-weight: 700;
      border-bottom: 2px solid red;
      padding-bottom: 5px;
      margin-bottom: 8px;

      word-break: keep-all;

      font-size: 31px;
      line-height: 1.45;

    }

    <?
      function getVal(data) {
        var str = "";
        if (!data) return str;
        for (var i = 0; i < data.length; i++) {
          var rowText = "";
          for (var j = 0; j < data[i].length; j++) {
            if (data[i][j] !== "" && data[i][j] !== null) {
              rowText += data[i][j];
            }
          }
          if (rowText !== "") {
            if (str !== "") str += "\n";
            str += rowText;
          }
        }
        return str;
      }
    ?>

  <script>
    function autoScale() {
      var container = document.getElementById('report-container');
      container.style.transform = 'scale(1)';

      var winW = window.innerWidth;
      var winH = window.innerHeight;
      var contentW = container.offsetWidth;
      var contentH = container.offsetHeight;
      if (!contentW || !contentH) return;

      var scale = Math.min(winW / contentW, winH / contentH) * 0.985;
      container.style.transform = 'scale(' + scale + ')';
    }

    function shrinkIfNeeded(selector, minSize) {
      var el = document.querySelector(selector);
      if (!el) return;
      var size = parseFloat(window.getComputedStyle(el).fontSize);
      while (el.scrollHeight > el.clientHeight && size > minSize) {
        size -= 1;
        el.style.fontSize = size + 'px';
      }
    }

    function fitPage() {
      shrinkIfNeeded('.info-table', 24);
      shrinkIfNeeded('.stats-table', 24);
      shrinkIfNeeded('.notes-grid', 18);
      shrinkIfNeeded('.course-line', 19);
      autoScale();
    }

    window.addEventListener('load', fitPage);
    window.addEventListener('resize', autoScale);
  </script>
