    function getVal(data) {
      var str = "";
      if (!data) return str;
      for (var i = 0; i < data.length; i++) {
        for (var j = 0; j < data[i].length; j++) {
          if (data[i][j] !== "" && data[i][j] !== null && data[i][j] !== undefined) {
            str += data[i][j];
          }
        }
      }

  <script>
    function autoScale() {
      var container = document.getElementById('report-container');
      container.style.transform = 'scale(1)';

      var winW = window.innerWidth;
      var winH = window.innerHeight;
      var contentW = container.offsetWidth;
      var contentH = container.offsetHeight;

      if (!contentW || !contentH) return;

      var scaleX = winW / contentW;
      var scaleY = winH / contentH;
      var finalScale = Math.min(scaleX, scaleY) * 0.985;

      container.style.transform = 'scale(' + finalScale + ')';
    }

    window.addEventListener('load', autoScale);
    window.addEventListener('resize', autoScale);
  </script>
