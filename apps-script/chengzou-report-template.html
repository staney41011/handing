    }

    .info-label {

      white-space: nowrap;
    }

    .info-value {

    }

    .stats-table {

      line-height: 1.25;
    }

    .stats-table td {

      text-align: left;
    }

    .stats-table .label {
      width: 145px;
    }

    .stats-table .num {
      color: blue;
      font-weight: 700;
      font-size: 32px;
      display: inline-block;
      min-width: 46px;
      text-align: center;
    }

    .stats-table .grand td {
      border-bottom: 2px solid red;
      font-size: 28px;
      padding-top: 10px;
    }

    .leave-area {

      overflow: hidden;
    }

    .leave-head {
      color: red;
      font-size: 27px;
      font-weight: 700;
      line-height: 32px;
      border-bottom: 2px solid red;

    .leave-line {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      align-items: start;
      margin-bottom: 5px;
      min-height: 0;
    }

    .leave-label {

      line-height: 25px;
      white-space: nowrap;
      font-weight: 700;
    }

    .leave-list {
      display: grid;

      color: blue;
      font-weight: 700;
      font-size: var(--leave-size, 19px);
      line-height: 1.24;
      min-width: 0;

    .leave-item {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;

    .empty-leave {

    }

      font-size: 23px;

      word-break: keep-all;
    }

      text-align: right;
      font-size: 27px;
    }
  </style>

  <?
    function getVal(data) {
      var str = "";
      if (!data) return str;
      for (var i = 0; i < data.length; i++) {
        for (var j = 0; j < data[i].length; j++) {
          if (data[i][j] !== "" && data[i][j] !== null) {
            if (str !== "") str += "\n";
            str += data[i][j];
          }
        }
      }
      return str;
    }
  ?>

  <script>
    function makeLeaveGrid(id) {
      var el = document.getElementById(id);
      if (!el) return;

      var raw = (el.textContent || "").replace(/\r/g, "").trim();
      el.textContent = "";

      if (!raw) {
        var none = document.createElement("span");
        none.className = "empty-leave";
        none.textContent = "無";
        el.style.setProperty("--cols", 1);
        el.appendChild(none);
        return;
      }

      var rows = raw.split(/\n+/).map(function(s) {
        return s.replace(/\t+/g, "　").replace(/\s{2,}/g, "　").trim();
      }).filter(Boolean);

      var count = rows.length;
      var cols = 6;
      var size = 20;

      if (count > 72) { cols = 13; size = 16; }
      else if (count > 60) { cols = 12; size = 17; }
      else if (count > 48) { cols = 10; size = 18; }
      else if (count > 36) { cols = 8; size = 19; }
      else if (count > 24) { cols = 7; size = 20; }
      else if (count > 12) { cols = 6; size = 20; }
      else { cols = 4; size = 21; }

      el.style.setProperty("--cols", cols);
      el.style.setProperty("--leave-size", size + "px");

      rows.forEach(function(row) {
        var item = document.createElement("div");
        item.className = "leave-item";
        item.textContent = row;
        el.appendChild(item);
      });
    }

    function autoScale() {
      var report = document.getElementById("report");
      report.style.transform = "scale(1)";

      var w = report.offsetWidth;
      var h = report.offsetHeight;
      if (!w || !h) return;

      var scale = Math.min(window.innerWidth / w, window.innerHeight / h) * 0.985;
      report.style.transform = "scale(" + scale + ")";
    }

    function init() {
      makeLeaveGrid("sick-list");
      makeLeaveGrid("personal-list");
      autoScale();
    }

    window.addEventListener("load", init);
    window.addEventListener("resize", autoScale);
  </script>
